<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bernardo Meneses | Portfolio</title>
    <link rel="icon" type="image/png" href="/src/assets/bm_icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;700&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Spectral:wght@400;600&family=Spectral+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      // Apply the saved theme before first paint (see context/Preferences.jsx)
      try {
        var theme = localStorage.getItem('bm:theme')
        if (theme !== 'dark' && theme !== 'paper') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
